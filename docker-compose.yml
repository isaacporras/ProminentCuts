services:
  web:
    build:
      context: .
      target: runner
    ports:
      - "3000:3000"
    env_file:
      - .env.local          # Variables de Google Calendar y Gmail
    volumes:
      # Monta las imágenes desde el host para poder reemplazarlas sin rebuild
      - ./public/images:/app/public/images:ro
    restart: unless-stopped
