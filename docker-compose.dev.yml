services:
  web:
    build:
      context: .
      target: deps          # Solo instala dependencias, sin compilar
    command: npm run dev
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    volumes:
      - .:/app              # Monta todo el código (hot reload)
      - /app/node_modules   # Excluye node_modules del bind mount
    environment:
      - NODE_ENV=development
