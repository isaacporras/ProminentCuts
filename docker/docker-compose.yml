services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runner
    ports:
      - "3000:3000"
    env_file:
      - ../.env.local
    environment:
      # Debe apuntar dentro de un volumen persistente: si no, cada rebuild
      # borra la base de datos y las fotos subidas desde /admin.
      - DATABASE_PATH=/app/data/app.db
    volumes:
      # rw (no :ro) — /admin sube fotos de providers a esta misma carpeta.
      - ../public/brand:/app/public/brand
      - db-data:/app/data
    restart: unless-stopped

volumes:
  db-data:
